<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF3FB">
<title>Magic E Word Lab · ESL Clubhouse Fun</title>
<style>
:root{
  --sky:#EAF3FB; --ink:#22304F; --ink-soft:#5A6784; --line:#D6E2F0;
  --rose:#FF9DB0; --rose-d:#D9486B; --rose-l:#FFE6EC;
  --lav:#A58BFF; --lav-d:#6A4BD9; --lav-l:#EFE9FF;
  --mint:#8FE0C9; --mint-d:#1F9C7E; --mint-l:#E1F7F0;
  --sun:#FFD873; --sun-d:#C98F00;
  --peach-l:#FFF1E6;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  font-family:var(--font); color:var(--ink); background:var(--sky);
  background-image:radial-gradient(#D3E2F2 1.5px,transparent 1.7px); background-size:24px 24px;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--lav-d);outline-offset:4px}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(12px,3vw,28px) 0}
.mark{font-weight:900;font-size:clamp(15px,1.5vw,24px);white-space:nowrap}
.mark span,.brand span{color:var(--mint-d)}
.steps{display:flex;gap:clamp(5px,1vw,8px)}
.step{width:clamp(32px,4vw,54px);height:clamp(32px,4vw,54px);border-radius:50%;background:#fff;border:3px solid var(--line);
  font-weight:900;font-size:clamp(14px,1.6vw,22px);color:var(--ink-soft);transition:background .3s,border-color .3s}
.step.done{background:var(--sun);border-color:var(--sun-d);color:var(--ink)}
.step.cur{background:var(--lav-l);border-color:var(--lav-d);color:var(--lav-d);transform:scale(1.1)}
.homebtn{display:flex;align-items:center;gap:6px;height:clamp(46px,4.4vw,60px);padding:0 clamp(18px,1.6vw,26px);font-size:clamp(18px,1.6vw,24px)!important;border-radius:999px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:18px;font-weight:900;color:var(--ink);white-space:nowrap}
.homebtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- stage ---------- */
main#stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:10px clamp(12px,3vw,28px) 24px}
main#stage > section{transform-origin:top center}
.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(-10px)}}
section{width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,20px);text-align:center}
.head h2{font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1.1}
.head p{font-size:clamp(18px,2.4vw,23px);color:var(--ink-soft);font-weight:700;margin-top:6px;line-height:1.3}
.head p b{color:var(--ink);font-size:1.12em}
.fb{min-height:1.4em;font-size:clamp(19px,2.6vw,24px);font-weight:900;line-height:1.3}
.fb.ok{color:var(--mint-d)} .fb.no{color:var(--rose-d)}
.dots{display:flex;gap:8px}
.dots span{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.dots span.on{background:var(--sun);border-color:var(--sun-d)}
.dots span.cur{background:var(--lav);border-color:var(--lav-d)}

/* ---------- letter tiles ---------- */
.word{--t:clamp(56px,13vw,100px);position:relative;display:inline-flex;gap:calc(var(--t)*.12);margin-top:calc(var(--t)*.72)}
.word.w6{--t:clamp(42px,10.5vw,80px)}
.word.sm{--t:clamp(34px,6.5vw,48px);margin-top:calc(var(--t)*.62)}
.slot{display:flex;flex-direction:column;align-items:center;gap:calc(var(--t)*.11)}
.tile{width:var(--t);height:calc(var(--t)*1.12);border-radius:calc(var(--t)*.2);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--t)*.72);font-weight:800;line-height:1;padding-bottom:.08em;background:#fff;color:var(--ink);
  border:3px solid var(--ink);box-shadow:0 calc(var(--t)*.07) 0 var(--ink);
  transition:background .45s,color .45s,border-color .45s,box-shadow .45s,transform .3s}
.tile.vA{background:var(--rose-l);border-color:var(--rose-d);color:var(--rose-d);box-shadow:0 calc(var(--t)*.07) 0 var(--rose-d)}
.tile.vE{background:var(--lav-l);border-color:var(--lav-d);color:var(--lav-d);box-shadow:0 calc(var(--t)*.07) 0 var(--lav-d)}
.tile.vA.ok{background:var(--mint-l);border-color:var(--mint-d);color:var(--mint-d);box-shadow:0 calc(var(--t)*.07) 0 var(--mint-d),0 0 0 6px rgba(143,224,201,.55)}
.word.magic .tile.vA,.word.magic .tile.vE{background:var(--lav);color:#fff;border-color:var(--lav-d);box-shadow:0 calc(var(--t)*.07) 0 var(--lav-d)}
.word.magic.anim .tile.vA,.word.magic.anim .tile.vE{animation:sayname .7s ease}
@keyframes sayname{40%{transform:scale(1.18) rotate(-5deg)}}
.tile.blank{border:3px dashed #93A7C3;background:#F6F9FD;box-shadow:none}
.tile.target{border:3px dashed var(--lav-d);background:rgba(239,233,255,.7);box-shadow:none;animation:glow 1.6s ease-in-out infinite}
.tile.target.hot{background:var(--lav);transform:scale(1.08)}
@keyframes glow{50%{box-shadow:0 0 0 9px rgba(165,139,255,.3)}}
.tile.land{animation:land .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{from{transform:translateY(-70%) scale(.5);opacity:0}}
.tile.lit{transform:translateY(-14%);box-shadow:0 0 0 6px var(--sun),0 calc(var(--t)*.07) 0 var(--ink)}
.lab{height:calc(var(--t)*.36);font-size:calc(var(--t)*.25);font-weight:900;white-space:nowrap}
.word.sm .lab{display:none}
.snd{display:inline-block;padding:.08em .45em;border-radius:99px;background:var(--rose-l);color:var(--rose-d)}
.word.magic .snd{background:var(--lav-l);color:var(--lav-d)}
.snd.swap{animation:pop .45s ease}
.quiet{color:var(--ink-soft);font-size:.82em}
@keyframes pop{40%{transform:scale(1.35)}}
svg.arc{position:absolute;pointer-events:none;overflow:visible}
svg.arc path{fill:none;stroke:var(--lav-d);stroke-linecap:round}
svg.arc circle{fill:var(--lav-d)}

/* ---------- magic e tile ---------- */
.etile{--t:clamp(62px,14vw,100px);width:var(--t);height:calc(var(--t)*1.12);border-radius:calc(var(--t)*.2);
  font-size:calc(var(--t)*.72);font-weight:800;line-height:1;padding-bottom:.08em;color:#fff;background:var(--lav);
  border:3px solid var(--lav-d);box-shadow:0 7px 0 var(--lav-d);position:relative;touch-action:none;
  animation:float 2.2s ease-in-out infinite;cursor:grab;z-index:5}
.etile::before,.etile::after{content:"✦";position:absolute;color:var(--sun-d);font-size:calc(var(--t)*.26);animation:twinkle 1.4s ease-in-out infinite}
.etile::before{top:-18%;right:-14%}
.etile::after{bottom:4%;left:-20%;animation-delay:.7s;font-size:calc(var(--t)*.18)}
.etile.dragging{animation:none;cursor:grabbing;z-index:60;transition:none}
.etile.back{animation:none;transition:transform .3s ease}
.etile.gone{visibility:hidden}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}

/* ---------- shared blocks ---------- */
.bench,.panel{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.8vw,36px);flex-wrap:wrap;
  background:#fff;border:3px solid var(--line);border-radius:30px;padding:clamp(14px,2.6vw,28px);width:100%}
.panel{width:auto;padding:clamp(12px,2.4vw,24px) clamp(18px,4vw,40px)}
.build{display:flex;flex-direction:column;align-items:center;gap:10px}
@media (min-width:621px){ .build{flex-direction:row;align-items:flex-end;gap:clamp(12px,2vw,24px)} .build .spk{margin-bottom:calc(var(--t,100px)*.5)} .build:has(.w6){flex-direction:column;align-items:center} .build:has(.w6) .spk{margin-bottom:0} }
.dock{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:110px}
.dockhint{font-weight:900;color:var(--lav-d);font-size:clamp(15px,2vw,17px);line-height:1.2}
.pic{width:clamp(110px,19vw,170px);aspect-ratio:1;border-radius:26px;background:var(--peach-l);border:3px solid #F6DCC6;
  display:flex;align-items:center;justify-content:center;padding:10px;flex:none}
.pic svg,.pchoice svg{width:100%;height:100%;display:block}
.pic img,.pchoice img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pic.mystery{background:var(--lav-l);border:3px dashed var(--lav-d);font-size:clamp(56px,9vw,84px);font-weight:900;color:var(--lav-d);line-height:1}
.pic.swap{animation:flip .48s ease}
@keyframes flip{50%{transform:rotateY(90deg) scale(.9)}}
.spk{width:56px;height:56px;border-radius:50%;background:var(--mint-l);border:3px solid var(--mint-d);font-size:25px;box-shadow:0 4px 0 var(--mint-d);flex:none}
.spk.big{width:clamp(72px,11vw,92px);height:clamp(72px,11vw,92px);font-size:clamp(32px,5vw,42px);box-shadow:0 6px 0 var(--mint-d)}
.talking{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.1)}}
.btn{padding:14px 34px;border-radius:999px;background:var(--mint);border:3px solid var(--mint-d);box-shadow:0 6px 0 var(--mint-d);
  font-size:clamp(20px,3vw,26px);font-weight:900;color:#0D4A3B;transition:transform .1s,box-shadow .1s}
.btn.big{padding:clamp(16px,2.6vh,22px) clamp(36px,6vw,58px);font-size:clamp(26px,4.4vw,38px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-d)}
.after{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 22px}
.after .rule{flex-basis:100%;order:-1}
.after[hidden]{display:flex!important;visibility:hidden}
.after.show{animation:enter .4s ease both}
.compare,.rrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,16px);flex-wrap:wrap}
.pill{padding:8px 20px;border-radius:999px;font-size:clamp(22px,3.4vw,30px);font-weight:900;border:3px solid}
.pill.short{background:var(--rose-l);border-color:var(--rose-d);color:var(--rose-d);box-shadow:0 4px 0 var(--rose-d)}
.pill.long{background:var(--lav-l);border-color:var(--lav-d);color:var(--lav-d);box-shadow:0 4px 0 var(--lav-d)}
.to{font-size:clamp(26px,4vw,36px);font-weight:900;color:var(--ink-soft)}
.rule{font-size:clamp(21px,3.2vw,30px);font-weight:900;color:var(--lav-d);line-height:1.25}
.pat{display:inline-block;margin:0 .2em;padding:0 .35em;border-radius:12px;background:var(--lav-l);border:2px solid var(--lav);letter-spacing:.05em}
.pat i{font-style:normal;color:var(--lav-d)}
.right{animation:yay .6s ease;outline:5px solid var(--mint-d);outline-offset:5px}
@keyframes yay{40%{transform:scale(1.08)}}
.shake{animation:shake .45s ease}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---------- level 1 ---------- */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vw,26px);width:min(100%,660px)}
.choice{padding:clamp(14px,2.6vh,24px) 10px;border-radius:28px;font-size:clamp(21px,3.4vw,31px);font-weight:900;
  display:flex;flex-direction:column;align-items:center;gap:4px;border:4px solid;transition:transform .12s}
.choice .ipa{font-size:.85em}
.choice.short{background:var(--rose-l);border-color:var(--rose-d);color:var(--rose-d);box-shadow:0 7px 0 var(--rose-d)}
.choice.long{background:var(--lav-l);border-color:var(--lav-d);color:var(--lav-d);box-shadow:0 7px 0 var(--lav-d)}
.choice:active{transform:translateY(4px)}

/* ---------- level 3 ---------- */
.letters{display:flex;gap:clamp(14px,3vw,24px);justify-content:center;flex-wrap:wrap}
.ltr{--t:clamp(62px,12vw,90px);width:var(--t);height:calc(var(--t)*1.12);border-radius:calc(var(--t)*.2);font-size:calc(var(--t)*.7);font-weight:800;
  line-height:1;padding-bottom:.08em;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.ltr:active{transform:translateY(3px)}
.ltr.used{visibility:hidden}

/* ---------- level 4 ---------- */
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2.4vw,20px);width:min(100%,780px)}
.pchoice{aspect-ratio:1;background:#fff;border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:12%;transition:transform .12s}
.pchoice:active{transform:translateY(3px)}
.pchoice{position:relative;overflow:hidden}
.pchoice img{transition:transform .35s ease}
.pchoice.labeled img{transform:scale(.74) translateY(-15%)}
.plabel{position:absolute;left:0;right:0;bottom:7%;font-size:clamp(22px,3.6vw,32px);font-weight:900;color:var(--ink);line-height:1;animation:pop .45s ease}
.plabel b{color:var(--lav-d)}

/* ---------- level 5 ---------- */
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.4vw,14px);max-width:1000px;min-height:62px}
.l5foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 24px;min-height:64px}
@media (min-width:621px){ .l5foot .fb{white-space:nowrap} }
.card{padding:8px clamp(10px,1.2vw,15px);border-radius:18px;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  font-size:clamp(24px,3vw,29px);font-weight:800;transition:transform .15s,background .15s}
.card.sel{transform:translateY(-8px);background:var(--sun);border-color:var(--sun-d);box-shadow:0 5px 0 var(--sun-d)}
/* houses are pictures; sorted words land inside the dashed area */
.houses{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vw,48px);width:min(100%,900px)}
.house{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;border-radius:18px;transition:transform .15s}
.house:active{transform:scale(.98)}
.himg{position:relative;display:block;width:100%;aspect-ratio:1270 / 942}
.himg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.hlist{position:absolute;left:12%;right:12%;top:46%;bottom:9%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px 6px}
.hname{font-weight:900;font-size:clamp(19px,3.2vw,31px);line-height:1.1}
.hname span{margin-left:.3em}
.house.short .hname{color:var(--rose-d)}
.house.long .hname{color:var(--lav-d)}
.mini{display:inline-block;padding:.12em .5em;border-radius:10px;background:#fff;border:2px solid;color:var(--ink);font-size:clamp(15px,3.3vw,32px);font-weight:800;line-height:1.2}
.house.short .mini{border-color:var(--rose-d)}
.house.long .mini{border-color:var(--lav-d);box-shadow:inset 0 -4px 0 var(--lav)}

/* ---------- start / done / final ---------- */
.brand{font-weight:900;font-size:clamp(17px,2.4vw,22px);background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 18px}
.title{font-size:clamp(42px,8.5vw,84px);font-weight:900;line-height:.98;letter-spacing:.01em;color:var(--ink);text-shadow:0 5px 0 var(--lav)}
.sub{font-size:clamp(20px,3vw,27px);font-weight:800;color:var(--ink-soft)}
.demo{min-height:clamp(120px,22vw,190px);display:flex;align-items:flex-end;justify-content:center}
.go{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.stars{display:flex;gap:clamp(4px,1.4vw,12px);font-size:clamp(38px,7vw,64px)}
.st{color:#D5DFEC}
.st.on{color:var(--sun);text-shadow:0 3px 0 var(--sun-d);animation:starin .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.donebtns{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}
.btn.ghostbtn{background:#fff;border-color:var(--line);box-shadow:0 6px 0 var(--line);color:var(--ink)}
.btn.ghostbtn:active{box-shadow:0 2px 0 var(--line)}
.nexthint{font-size:clamp(17px,2.2vw,20px)!important}
.done h2{font-size:clamp(32px,6vw,54px);font-weight:900}
.done p{font-size:clamp(19px,2.6vw,24px);font-weight:800;color:var(--ink-soft)}
.trophy{font-size:clamp(64px,12vw,110px);line-height:1;animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-12px) rotate(4deg)}}
.title.fin{font-size:clamp(34px,7vw,66px)}
.review{display:grid;grid-template-columns:1fr;gap:clamp(4px,1vh,12px) 40px}
.rw{border-radius:18px;padding:0 6px 8px}
.rw:active{transform:scale(.97)}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100}
.cf{position:absolute;top:-24px;width:11px;height:15px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.bst{position:absolute;font-size:26px;font-weight:900;margin:-13px 0 0 -13px;animation:bst .85s ease-out forwards}
@keyframes bst{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}

@media (min-width:760px){ .review{grid-template-columns:1fr 1fr} }
@media (max-width:620px){
  .bench .build{order:3;flex-basis:100%}
  .pics{grid-template-columns:1fr 1fr;width:min(100%,380px)}
}
@media (max-width:480px){ .mark{display:none} .homebtn{padding:0 12px;font-size:0!important;gap:0} .homebtn span{font-size:22px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .cf{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="header" hidden>
    <div class="mark">ESL Clubhouse <span>Fun</span></div>
    <nav class="steps" id="steps" aria-label="Levels"></nav>
    <button class="homebtn" id="restart" aria-label="Home" title="Home"><span aria-hidden="true">🏠</span> Home</button>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* ================= CONFIG ================= */
// 'lower' shows word tiles as tap/tape; change to 'upper' for TAP/TAPE.
const LETTER_CASE = 'lower';

/* ================= HELPERS ================= */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const LC = w => LETTER_CASE === 'upper' ? w.toUpperCase() : w.toLowerCase();
const stage = $('#stage'), header = $('#header'), fx = $('#fx');
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const timers = new Set();
function later(fn, ms){ const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers.clear(); }

let S = null;
function freshState(){ return { level:0, round:0, busy:false, sel:null, sorted:0, l1:[] }; }

/* ================= SOUND ================= */
let actx = null;
function unlockAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }

const HAS_TTS = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
let voice = null, sayId = 0, currentAudio = null, talkingEl = null;
function pickVoice(){
  if(!HAS_TTS) return;
  const vs = speechSynthesis.getVoices() || [];
  const prefer = ['Samantha','Karen','Moira','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Daniel'];
  let v = null;
  for(const n of prefer){ v = vs.find(x => x.name && x.name.indexOf(n) !== -1 && /^en/i.test(x.lang)); if(v) break; }
  voice = v || vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang)) || null;
}
if(HAS_TTS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){ speechSynthesis.onvoiceschanged = pickVoice; } }

function stopTalkAnim(){ if(talkingEl){ talkingEl.classList.remove('talking'); talkingEl = null; } }
function stopSpeech(){
  sayId++;
  stopTalkAnim();
  if(HAS_TTS){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
}
function say(text, opts){
  opts = opts || {};
  const id = ++sayId;
  let finished = false;
  const done = () => {
    if(finished) return; finished = true;
    if(talkingEl && id === sayId) stopTalkAnim();
    if(opts.onend && id === sayId) opts.onend();
  };
  if(opts.el){ stopTalkAnim(); talkingEl = opts.el; opts.el.classList.add('talking'); }
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  const key = String(text).toLowerCase().trim();
  if(RECORDED[key]){
    if(HAS_TTS){ try{ speechSynthesis.cancel(); }catch(e){} }
    const a = player;
    try{ a.pause(); }catch(e){}
    a.onended = null; a.onerror = null;
    a.src = RECORDED[key];
    currentAudio = a;
    a.onended = done; a.onerror = done;
    const start = opts.from || 0;
    const go = () => { const p = a.play(); if(p && p.catch) p.catch(done); };
    if(start > 0){
      a.addEventListener('loadedmetadata', () => { if(id !== sayId) return; try{ a.currentTime = start; }catch(e){} go(); }, {once: true});
      a.load();
    } else { go(); }
    later(done, clipMs(key) + 800);
    return;
  }
  if(!HAS_TTS){ later(done, 700); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if(voice) u.voice = voice;
    u.rate = opts.rate || 0.82; u.pitch = 1.05; u.volume = 1;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
    later(done, 1800 + String(text).length * 140 / (u.rate));
  }catch(e){ later(done, 700); }
}

function confetti(n){

function burst(el, n){

function tilesHTML(word, o){

const NS = 'http://www.w3.org/2000/svg';
function drawArc(word, animate){
  const a = $('.tile.vA', word), e = $('.tile.vE', word);
  if(!a || !e) return;
  const old = $('svg.arc', word); if(old) old.remove();
  const tH = a.offsetHeight, W = word.offsetWidth;
  if(!tH || !W) return;
  const H = Math.round(tH * 0.62);
  const x1 = a.offsetLeft + a.offsetWidth/2, x2 = e.offsetLeft + e.offsetWidth/2;
  const top = a.offsetTop;
  const sw = Math.max(3.5, tH * 0.065);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'arc');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.left = '0px'; svg.style.top = (top - H) + 'px';
  const yb = H - sw * 0.9;
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', `M${x2} ${yb} Q${(x1+x2)/2} ${-H*0.55} ${x1} ${yb}`);

  const dotA = document.createElementNS(NS, 'circle');

  dotE.setAttribute('cx', x2); dotE.setAttribute('cy', yb); dotE.setAttribute('r', sw * 0.95);

/* Scale each screen to fill the window: bigger on laptops, iPads and class boards,

let SCALE = 1, fitRO = null;
function fit(allowGrow){
  const sec = stage.firstElementChild; if(!sec) return;
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = window.innerHeight - stage.offsetTop - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 10;
  const W = sec.offsetWidth, H = sec.offsetHeight;
  if(!W || !H) return;
  let s = Math.min(availW / W, availH / H, 1.8);
  s = Math.max(s, 0.8);
  if(!allowGrow) s = Math.min(s, SCALE);
  SCALE = s;
  sec.style.transform = s === 1 ? '' : `scale(${s})`;
  sec.style.marginBottom = (H * (s - 1)) + 'px';
  sec.style.marginTop = Math.max(0, (availH - H * s) / 2) + 'px';
}
function watchFit(){
  if(!('ResizeObserver' in window)) return;
  if(fitRO) fitRO.disconnect();

function dragE(el, target, onDrop){
  let st = null, moved = false;
  const near = (x, y, pad) => { const r = target.getBoundingClientRect(); return x > r.left-pad && x < r.right+pad && y > r.top-pad && y < r.bottom+pad; };
  el.addEventListener('pointerdown', ev => {
    if(S.busy) return;
    ev.preventDefault(); unlockAudio();
    st = {x: ev.clientX, y: ev.clientY, id: ev.pointerId}; moved = false;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    el.classList.remove('back'); el.classList.add('dragging');
  });
  el.addEventListener('pointermove', ev => {
    if(!st || ev.pointerId !== st.id) return;
    const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
    if(Math.hypot(dx, dy) > 10) moved = true;
    el.style.transform = `translate(${dx / SCALE}px, ${dy / SCALE}px) scale(1.1)`;
    target.classList.toggle('hot', near(ev.clientX, ev.clientY, 30));
  });
  el.addEventListener('pointerup', ev => {
    if(!st || ev.pointerId !== st.id) return;
    const hit = !moved || near(ev.clientX, ev.clientY, 44);
    st = null; el.classList.remove('dragging'); target.classList.remove('hot');
    if(hit){ el.style.transform = ''; onDrop(); }
    else { el.classList.add('back'); el.style.transform = ''; later(() => el.classList.remove('back'), 350); }
  });
  el.addEventListener('pointercancel', () => {
    if(!st) return;
    st = null; el.classList.remove('dragging'); target.classList.remove('hot'); el.style.transform = '';

        later(() => pic.classList.remove('swap'), 500);
      }
      $('.head p').innerHTML = `Now it says <b>${LC(b)}</b>!`;
      later(() => sayThen(b, {el: hear}, () => {
        revealAfter();
        say(challenge ? 'Same trick! The E helps A say its name.' : 'The E helps A say its name!');
      }, 300), 700);
    }, 450);
  }, 450);
}

/* ================= LEVEL 3 — BUILD ================= */
function L3(){
  const item = BUILD[S.round], w = item.w, last = S.round === BUILD.length - 1;
  show(`<section class="lvl">
    ${head('Build the word', 'Look at the picture. Which letter is missing?')}
    <div class="bench">
      <button class="pic" data-say="${w}" aria-label="Hear the word">${PIC[w]}</button>
      <div class="build">
        ${tilesHTML(w, {blank:1})}
        <button class="spk" data-say="${w}" aria-label="Hear the word">🔊</button>
      </div>
    </div>
    <div class="letters">${shuffle(item.opts).map(l => `<button class="ltr" data-l="${l}">${LC(l)}</button>`).join('')}</div>
    <p class="fb" aria-live="polite">&nbsp;</p>
    <div class="after" id="after" hidden>
      <button class="pill long" data-say="${w}">🔊 ${LC(w)}</button>
      <button class="btn" id="next">${last ? 'Finish level ✓' : 'Next word'}</button>
    </div>
    ${dots(S.round, BUILD.length)}
  </section>`);
  if(S.round === 0) later(() => say('Look at the picture. Which letter is missing?'), 300);
  $$('.ltr').forEach(btn => btn.addEventListener('click', () => {
    if(S.busy) return; unlockAudio();
    if(btn.dataset.l === 'a'){
      S.busy = true; sfx.pop(); btn.classList.add('used');
      const blank = $('.tile.blank');
      blank.classList.remove('blank'); blank.classList.add('vA', 'ok', 'land'); blank.textContent = LC('a');
      good('Yes! Now let’s blend it.');
      later(() => blendWord(w), 600);
    } else {
      wrong(btn, 'Try again! Listen to the middle sound.');
      later(() => say(w), 500);
    }
  }));
  $('#next').addEventListener('click', () => nextRound(3, BUILD.length, L3));
}
function blendWord(w){
  const word = $('.build .word'), tiles = $$('.tile', word);
  if(RECORDED[w] && SEGS[w]){
    // tapping the letter starts the recording; the letters light up in time with the word
    const seg = SEGS[w][0], t0 = seg[0] * 1000, d = Math.max(450, (seg[1] - seg[0]) * 1000);
    say(w, {el: $('.build .spk')});
    [[0], [1, 3], [2]].forEach((g, k) => later(() => {
      tiles.forEach(t => t.classList.remove('lit'));
      g.forEach(i => tiles[i] && tiles[i].classList.add('lit'));
      if(k === 1) magicify(word);
    }, t0 + k * d / 3));
    later(() => { tiles.forEach(t => t.classList.remove('lit')); }, t0 + d);
    // blend it: whole word lit, said once more
    later(() => {
      tiles.forEach(t => t.classList.add('lit'));
      burst(word, 10); good(`${LC(w)}! The e helps a say its name.`);
      sayThen(w, {}, () => { tiles.forEach(t => t.classList.remove('lit')); sfx.good(); revealAfter(); }, 250);
    }, clipMs(w) + 500);
    return;
  }
  say(w, {rate: 0.4});
  const groups = [[0], [1, 3], [2]];
  groups.forEach((g, k) => later(() => {
    tiles.forEach(t => t.classList.remove('lit'));
    g.forEach(i => tiles[i] && tiles[i].classList.add('lit'));
    if(k === 1) magicify(word);
  }, k * 600));
  later(() => {
    tiles.forEach(t => t.classList.add('lit'));
    sfx.good(); burst(word, 10);
    good(`${LC(w)}! The e helps a say its name.`);
    say(w, {rate: 0.9});
  }, 2000);
  later(() => { tiles.forEach(t => t.classList.remove('lit')); revealAfter(); }, 2800);
}

/* ================= LEVEL 4 — MEANING ================= */
function L4(){
  const item = MEANING[S.round], w = item.w;
  show(`<section class="lvl">
    ${head('Word to picture', 'Read the word. Tap the matching picture.')}
    <div class="panel">
      ${tilesHTML(w, {ipa:true})}
      <button class="spk" data-say="${w}" aria-label="Hear the word">🔊</button>
    </div>
    <div class="pics">${shuffle(item.opts).map(o => `<button class="pchoice" data-w="${o}" aria-label="Picture choice">${PIC[o]}</button>`).join('')}</div>
    <p class="fb" aria-live="polite">&nbsp;</p>
    ${dots(S.round, MEANING.length)}
  </section>`);
  magicify($('.panel .word'), false);
  if(S.round === 0) later(() => say('Read the word. Tap the matching picture.'), 300);
  $$('.pchoice').forEach(p => p.addEventListener('click', () => {
    if(S.busy) return; unlockAudio();
    if(p.dataset.w === w){
      S.busy = true; p.classList.add('right', 'labeled'); sfx.good(); burst(p);
      const lbl = document.createElement('span');
      lbl.className = 'plabel';
      lbl.innerHTML = Array.from(LC(w)).map((ch, i, arr) =>
        (ch.toLowerCase() === 'a' || (ch.toLowerCase() === 'e' && i === arr.length - 1)) ? `<b>${ch}</b>` : ch).join('');
      p.appendChild(lbl);
      good(`Yes! ${LC(w)}!`);
      sayThen(w, {}, () => nextRound(4, MEANING.length, L4), 900);
    } else {
      wrong(p, 'Try again! Look for the magic e.');
    }
  }));
}

  later(() => say('Tap a word. Then tap its house.'), 300);
  $$('.card').forEach(c => c.addEventListener('click', () => {
    if(S.busy) return; unlockAudio();
    $$('.card').forEach(x => x.classList.remove('sel'));
    c.classList.add('sel'); S.sel = c.dataset.w;
    sfx.pop(); say(S.sel, {el: c});
    const fb = $('.fb'); fb.className = 'fb'; fb.innerHTML = '&nbsp;';
  }));
  const praise = ['Yes!', 'Great!', 'Well done!', 'Super!'];
  $$('.house').forEach(h => h.addEventListener('click', () => {
    if(S.busy) return; unlockAudio();
    if(!S.sel){ wrong(h, 'Tap a word first!'); return; }
    const w = S.sel, correct = w.endsWith('e') ? 'long' : 'short';
    if(h.dataset.h === correct){
      const card = $(`.card[data-w="${w}"]`);
      moveCard(card, h); S.sel = null; S.sorted++;
      sfx.good();
      good(`${praise[S.sorted % praise.length]} “${LC(w)}” has a ${correct === 'long' ? 'LONG' : 'SHORT'} A.`);
      if(S.sorted === SORT_WORDS.length){
        S.busy = true;
        later(() => { confetti(80); sfx.fanfare(); good('All sorted! Great job!'); say('All sorted! Great job!'); revealAfter(); }, 700);
      }
    } else {
      wrong(h, `Try again! Listen: “${LC(w)}”. Is there a magic e?`);
      later(() => say(w), 500);
    }
  }));
  $('#next').addEventListener('click', () => levelDone(5));
}
function moveCard(card, house){
  const from = card.getBoundingClientRect();
  const list = $('.hlist', house);
  const mini = document.createElement('span');
  mini.className = 'mini'; mini.textContent = card.textContent;
  list.appendChild(mini);
  card.remove();
  const to = mini.getBoundingClientRect();
  mini.style.transformOrigin = 'top left';
  mini.style.transition = 'none';
  mini.style.transform = `translate(${(from.left - to.left) / SCALE}px, ${(from.top - to.top) / SCALE}px) scale(${(from.width / Math.max(to.width, 1)).toFixed(3)})`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    mini.style.transition = 'transform .6s cubic-bezier(.3,1.3,.5,1)';
    mini.style.transform = 'none';
  }));
}

/* ================= LEVEL COMPLETE ================= */
function levelDone(n){
  if(n >= LEVELS.length){ finalScreen(); return; }
  setHeader(0, n);
  header.hidden = false;
  show(`<section class="done">
    <div class="stars" aria-label="${n} of ${LEVELS.length} levels complete">${
      LEVELS.map((_, i) => `<span class="st${i < n ? ' on' : ''}" style="--d:${(i*0.08).toFixed(2)}s">★</span>`).join('')}</div>
    <h2>${LEVELS[n-1].done}</h2>
    <p>Level ${n} complete!</p>
    <div class="donebtns">
      <button class="btn ghostbtn" id="replay">↺ Play again</button>
      <button class="btn big" id="go">Next level ▶</button>
    </div>
    <p class="nexthint">Next: ${LEVELS[n].title}</p>
  </section>`);
  confetti(); sfx.fanfare();
  later(() => say(LEVELS[n-1].done), 300);
  $('#go').addEventListener('click', () => { unlockAudio(); goLevel(n + 1); });
  $('#replay').addEventListener('click', () => { unlockAudio(); goLevel(n); });
}

/* ================= FINAL ================= */
function finalScreen(){
  setHeader(0, LEVELS.length);
  header.hidden = false;
  show(`<section class="final">
    <div class="trophy" aria-hidden="true">🏆</div>
    <h1 class="title fin">MAGIC E MASTER!</h1>
    <div class="review">${PAIRS.map(p => `<div class="rrow">
      <button class="rw" data-say="${p[0]}" aria-label="Hear ${p[0]}">${tilesHTML(p[0], {size:'sm'})}</button>
      <span class="to" aria-hidden="true">→</span>
      <button class="rw" data-say="${p[1]}" aria-label="Hear ${p[1]}">${tilesHTML(p[1], {size:'sm'})}</button>
    </div>`).join('')}</div>
    <p class="rule">When E comes to the end, A says its name!</p>
    <button class="btn big" id="again">PLAY AGAIN</button>
  </section>`);
  $$('.review .word').forEach(w => { if(w.dataset.word.endsWith('e')) magicify(w, false); });
  confetti(130); sfx.fanfare();
  later(() => say('Magic E Master! When E comes to the end, A says its name!'), 400);
  $('#again').addEventListener('click', () => { unlockAudio(); resetGame(); });
}

/* ================= RESET / BOOT ================= */
function resetGame(){
  clearTimers(); stopSpeech();
  fx.innerHTML = '';
  S = freshState();
  startScreen();
}
const RENDER = {1: L1, 2: L2, 3: L3, 4: L4, 5: L5};

// one delegated handler for every speaker / hear-it button
stage.addEventListener('click', ev => {
  const b = ev.target.closest('[data-say]');
  if(!b || !stage.contains(b)) return;
  unlockAudio();
  say(b.dataset.say, {el: b});
});
$('#steps').addEventListener('click', ev => {
  const b = ev.target.closest('.step'); if(!b) return;
  unlockAudio(); goLevel(+b.dataset.lv);
});
$('#restart').addEventListener('click', () => { unlockAudio(); resetGame(); });

buildSteps();
S = freshState();
startScreen();
})();
</script>
